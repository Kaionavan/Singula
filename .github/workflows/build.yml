name: Build Singula APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Установить Flutter вручную
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'

      - name: Прогреть Flutter
        run: flutter doctor

      - name: Создать local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> android/local.properties

      - name: Получить зависимости
        run: flutter pub get

      - name: Найти плагины с v1 embedding
        run: |
          echo "=== Ищем AndroidManifest.xml с v1 embedding ==="
          find ~/.pub-cache -name "AndroidManifest.xml" | xargs grep -l 'android:value="1"' 2>/dev/null || echo "Не найдено"
          echo "=== Ищем упоминания FlutterMain ==="
          find ~/.pub-cache -name "AndroidManifest.xml" | xargs grep -l "FlutterMain" 2>/dev/null || echo "Не найдено"

      - name: Собрать APK
        run: flutter build apk --release

      - name: Сохранить APK
        uses: actions/upload-artifact@v4
        with:
          name: Singula-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
