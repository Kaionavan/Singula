name: Build Singula APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Установить Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Создать local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> android/local.properties

      - name: Получить зависимости
        run: flutter pub get

      - name: Патч манифеста
        run: |
          find . -name "AndroidManifest.xml" -exec sed -i 's/android:value="1"/android:value="2"/g' {} \;
          find $HOME/.pub-cache -name "AndroidManifest.xml" -exec sed -i 's/android:value="1"/android:value="2"/g' {} \;
          find $HOME/.pub-cache -name "AndroidManifest.xml" | xargs grep -l "FlutterMain\|v1\|pluginClass" 2>/dev/null || echo "nothing suspicious"

      - name: Собрать APK
        run: flutter build apk --release

      - name: Сохранить APK
        uses: actions/upload-artifact@v4
        with:
          name: Singula-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
