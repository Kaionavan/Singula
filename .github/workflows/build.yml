name: Build Singula APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Установить Flutter вручную
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Прогреть Flutter
        run: flutter doctor

      - name: Создать local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> android/local.properties

      - name: Получить зависимости
        run: flutter pub get

      - name: Патч Flutter tools
        run: |
          FILE="$FLUTTER_ROOT/packages/flutter_tools/lib/src/project.dart"
          sed -i 's/if (result\.version != AndroidEmbeddingVersion\.v1) {/if (true) {/g' "$FILE"
          sed -i 's/if (androidEmbeddingVersion == AndroidEmbeddingVersion\.v1) {/if (false) {/g' "$FILE"
          echo "=== Проверка ==="
          grep -n "if (true\|if (false\|v1)" "$FILE" | head -20
          rm -f "$FLUTTER_ROOT/bin/cache/flutter_tools.stamp"
          rm -f "$FLUTTER_ROOT/bin/cache/flutter_tools.snapshot"

      - name: Собрать APK
        run: flutter build apk --release

      - name: Сохранить APK
        uses: actions/upload-artifact@v4
        with:
          name: Singula-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
