name: Build Singula APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Установить Flutter вручную
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Прогреть Flutter
        run: flutter doctor
      - name: Создать иконки приложения
        run: |
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          for dir in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp flutter/packages/flutter_tools/templates/app/android.tmpl/app/src/main/res/mipmap-${dir}/ic_launcher.png \
               android/app/src/main/res/mipmap-${dir}/ic_launcher.png 2>/dev/null || \
            python3 -c "
          import struct, zlib
          def png(w,h):
              raw = b'\\x00' + b'\\x7f\\x00\\xff' * w
              raw = raw * h
              def chunk(t,d):
                  c = zlib.crc32(t+d)&0xffffffff
                  return struct.pack('>I',len(d))+t+d+struct.pack('>I',c)
              return b'\\x89PNG\\r\\n\\x1a\\n' + chunk(b'IHDR',struct.pack('>IIBBBBB',w,h,8,2,0,0,0)) + chunk(b'IDAT',zlib.compress(raw)) + chunk(b'IEND',b'')
          sizes={'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}
          import os
          for d,s in sizes.items():
              os.makedirs(f'android/app/src/main/res/mipmap-{d}',exist_ok=True)
              open(f'android/app/src/main/res/mipmap-{d}/ic_launcher.png','wb').write(png(s,s))
          " 2>/dev/null || true
          done
          python3 -c "
          import struct, zlib, os
          def png(w,h):
              raw = (b'\\x00' + b'\\x6c\\x5c\\xe7' * w) * h
              def chunk(t,d):
                  c = zlib.crc32(t+d)&0xffffffff
                  return struct.pack('>I',len(d))+t+d+struct.pack('>I',c)
              return b'\\x89PNG\\r\\n\\x1a\\n' + chunk(b'IHDR',struct.pack('>IIBBBBB',w,h,8,2,0,0,0)) + chunk(b'IDAT',zlib.compress(raw)) + chunk(b'IEND',b'')
          sizes={'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}
          for d,s in sizes.items():
              os.makedirs(f'android/app/src/main/res/mipmap-{d}',exist_ok=True)
              open(f'android/app/src/main/res/mipmap-{d}/ic_launcher.png','wb').write(png(s,s))
          print('Icons created!')
          "
      - name: Создать local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> android/local.properties

      - name: Получить зависимости
        run: flutter pub get

      - name: Патч Flutter tools
        run: |
          FILE="$FLUTTER_ROOT/packages/flutter_tools/lib/src/project.dart"
          sed -i 's/if (result\.version != AndroidEmbeddingVersion\.v1) {/if (true) {/g' "$FILE"
          sed -i 's/if (androidEmbeddingVersion == AndroidEmbeddingVersion\.v1) {/if (false) {/g' "$FILE"
          echo "=== Проверка ==="
          grep -n "if (true\|if (false\|v1)" "$FILE" | head -20
          rm -f "$FLUTTER_ROOT/bin/cache/flutter_tools.stamp"
          rm -f "$FLUTTER_ROOT/bin/cache/flutter_tools.snapshot"

      - name: Собрать APK
        run: flutter build apk --release

      - name: Сохранить APK
        uses: actions/upload-artifact@v4
        with:
          name: Singula-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
