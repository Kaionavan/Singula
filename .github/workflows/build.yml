name: Build Singula APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Установить Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Создать local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> android/local.properties

      - name: Получить зависимости
        run: flutter pub get

      - name: Найти виновника
        run: |
          echo "=== Ищем v1 embedding в проекте ==="
          grep -r "android:value=\"1\"" . --include="AndroidManifest.xml" -l 2>/dev/null || echo "не найдено в проекте"
          echo "=== Ищем в pub-cache ==="
          grep -r "android:value=\"1\"" $HOME/.pub-cache --include="AndroidManifest.xml" -l 2>/dev/null || echo "не найдено в pub-cache"
          echo "=== Ищем FlutterMain в pub-cache ==="
          grep -r "FlutterMain" $HOME/.pub-cache --include="AndroidManifest.xml" -l 2>/dev/null || echo "не найдено"

      - name: Собрать APK
        run: flutter build apk --release --verbose 2>&1 | head -50

      - name: Сохранить APK
        uses: actions/upload-artifact@v4
        with:
          name: Singula-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
