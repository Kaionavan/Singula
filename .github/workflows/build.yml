name: Build Singula APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Установить Flutter вручную
        run: |
          git clone https://github.com/flutter/flutter.git --depth 1 --branch 3.22.3 $HOME/flutter
          echo "$HOME/flutter/bin" >> $GITHUB_PATH

      - name: Прогреть Flutter
        run: flutter precache --android

      - name: Создать local.properties
        run: |
          echo "flutter.sdk=$HOME/flutter" > android/local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> android/local.properties

      - name: Получить зависимости
        run: flutter pub get

      - name: Собрать APK
        run: flutter build apk --release --verbose > /tmp/build_log.txt 2>&1 || true

      - name: Показать лог
        run: cat /tmp/build_log.txt

      - name: Сохранить лог
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build_log.txt
          retention-days: 7
